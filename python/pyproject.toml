[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dslrs"
version = "0.1.0"
description = "Deanonymizable Scope-Linked Ring Signature (DSLRS) on secp256k1"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [
    { name = "Montassar" }
]
keywords = [
    "cryptography",
    "ring-signature",
    "secp256k1",
    "linkable-ring-signature",
    "threshold-deanonymization",
    "privacy",
    "dslrs"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "ecdsa>=0.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "build>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/montassar-isbored/DSLRS-packages"
Repository = "https://github.com/montassar-isbored/DSLRS-packages"
Issues = "https://github.com/montassar-isbored/DSLRS-packages/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dslrs"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
